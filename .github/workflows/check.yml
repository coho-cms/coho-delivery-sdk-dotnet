name: Check

# Version branches only, such as v2026.1.0: pull requests into one, and commits to one.
on:
  pull_request:
    branches: ['v*']
  push:
    branches: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 8 as well as 10, so the net8.0 build is tested on the runtime it targets.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release
        env:
          # Each build on its own runtime, not rolled forward to the newest.
          DOTNET_ROLL_FORWARD: Disable
      - run: dotnet pack --no-build -c Release -o artifacts
